services:
  panel:
    build: .
    image: gameserver-panel:latest
    container_name: gameserver-panel
    restart: unless-stopped
    ports:
      # Nur lokal veröffentlichen. Von außen erreichbar machen ausschließlich
      # über einen Reverse-Proxy mit TLS — siehe README, Abschnitt Sicherheit.
      - "127.0.0.1:8770:8770"
    environment:
      # Zeitzone der Instanzen und der Backup-Zeitpläne.
      TZ: Europe/Berlin
      # Adresse, unter der Spieler die Server erreichen — erscheint im Detailkopf
      # und wird für die Serverabfragen (Ping, Spielerzahl) benutzt.
      GSP_PUBLIC_HOST: ${GSP_PUBLIC_HOST:-localhost}
      GSP_NODE_LABEL: ${GSP_NODE_LABEL:-node 01}
      # Auf `true` setzen, sobald das Panel hinter TLS läuft.
      GSP_SECURE_COOKIES: ${GSP_SECURE_COOKIES:-false}
      # Pfad der Daten aus Sicht des Docker-Hosts. Die Instanz-Container werden
      # vom Daemon des Hosts gestartet, der Bind-Mounts aus seiner eigenen Sicht
      # auflöst — deshalb muss hier der Host-Pfad stehen, nicht der im Panel.
      GSP_HOST_DATA_DIR: ${GSP_DATA_DIR:-/srv/gameserver}
    volumes:
      # Zugriff auf die Docker-Engine, um Instanz-Container zu steuern.
      # ACHTUNG: Das entspricht Root-Rechten auf dem Host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Datenbank, Instanz-Volumes und Backups.
      - ${GSP_DATA_DIR:-/srv/gameserver}:/data
